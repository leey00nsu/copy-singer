services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copy_singer}
      POSTGRES_USER: ${POSTGRES_USER:-copy_singer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copy_singer_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vocal-profile-api:
    build:
      context: .
      dockerfile: services/vocal-profile-api/Dockerfile
    restart: unless-stopped
    environment:
      VOCAL_PROFILE_STORAGE_ROOT: /data
    ports:
      - "127.0.0.1:${VOCAL_PROFILE_API_PORT:-8001}:8000"
    volumes:
      - ./work/vocal-profiles:/data
      - demucs_models:/root/.cache/torch/hub/checkpoints
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  demucs_models:
