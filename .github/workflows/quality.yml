name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      HUSKY: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/copy_singer?schema=public
      BETTER_AUTH_SECRET: copy-singer-ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      DEV_AUTH_BYPASS_ENABLED: "false"
      ENABLE_DEV_SVC: "false"
      VOCAL_PROFILE_ANALYZER_BACKEND: local
      VOCAL_PROFILE_API_URL: http://127.0.0.1:8001
      MODAL_API_URL: https://modal.example.test
      MODAL_API_KEY: ci-modal-api-key
      LEEMAGE_BASE_URL: https://leemage.example.test/api/v1
      LEEMAGE_API_KEY: ci-leemage-api-key
      LEEMAGE_PROJECT_ID: ci-project
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: copy_singer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copy_singer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Import test catalog
        run: pnpm run catalog:import

      - name: Run static checks
        run: pnpm run check

      - name: Validate database schema
        run: |
          pnpm run db:validate
          pnpm run db:status

      - name: Run regression suite
        run: pnpm test
